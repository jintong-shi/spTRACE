[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spTRACE"
version = "0.1.0"
description = "Agent-based simulator of spatial transcriptomics data with allele-specific copy-number variation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jintong Shi", email = "jintongs@kth.se" }]
keywords = [
    "spatial-transcriptomics",
    "copy-number-variation",
    "simulation",
    "benchmarking",
    "single-cell",
    "tumour-heterogeneity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    "joblib>=1.2",
    "tqdm>=4.64",
    # Required, not optional: tables are written as Parquet unless --no-parquet is passed.
    "pyarrow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/jintong-shi/spTRACE"
Issues = "https://github.com/jintong-shi/spTRACE/issues"

[project.scripts]
sptrace-simulate = "sptrace.cli.simulate:main"
sptrace-batch = "sptrace.cli.batch:main"
sptrace-export-numbat = "sptrace.cli.export_numbat:main"
sptrace-prep-snps = "sptrace.cli.prep_snps:main"
sptrace-make-example-reference = "sptrace.cli.make_example_reference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end runs that execute a real simulation (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are common in dense numeric expressions
    "E741",  # `l`/`I` are used as lattice indices throughout
    "B905",  # zip() without strict=, for 3.9-style compatibility
]

# The numerical core carries pre-existing lint debt: legacy typing spellings
# (Dict/Optional rather than dict/X | None), unused imports, and several
# statements per line. Cleaning it up would touch simulation code without
# changing behaviour, so it is tracked here rather than folded into the release.
# Do not add files to this list; new code is expected to be clean.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"src/sptrace/model.py" = ["UP", "F401", "F841", "E701", "E702", "E401", "I001", "B007", "W293"]
"src/sptrace/formatting.py" = ["UP", "F401", "E701", "E702", "E401", "I001", "W293"]
"src/sptrace/utils.py" = ["UP", "F401", "F811", "F841", "E701", "E702", "E401", "I001", "W293"]
"src/sptrace/pipeline.py" = ["UP", "F401", "I001", "W293"]
"src/sptrace/cnv_utils.py" = ["UP", "F401", "E701", "E702", "I001", "W293"]
"src/sptrace/cnv_logging.py" = ["UP", "I001", "W293"]
"src/sptrace/cli/batch.py" = ["UP", "E701", "E702", "I001", "W293"]
# qc.py is the QC analysis and plotting code lifted verbatim out of batch.py.
"src/sptrace/qc.py" = ["UP", "E701", "E702", "I001", "W293", "B007"]