# Reference design file for st-cnv-simulator.
#
# Paths under [files] may be absolute, or relative to THIS file's directory.
# Environment variables ($VAR) and ~ are expanded.
#
# Every section below is documented in docs/configuration.md.

[files]
# Chromosome lengths: columns chr,length
chr_lengths_file = "../data/reference/chr_lengths.csv"
# Gene annotation: columns gene,chr,start,end
gene_table_file = "../data/reference/gene_order.csv"
# Reference expression matrix: TSV, genes as rows, cells as columns.
# NOT bundled (too large) -- see data/reference/README.md.
refexp_file = "../data/reference/counts.tsv"
# Cell-type labels: TSV, cell barcodes as rownames, one cell-type column
refcelltype_file = "../data/reference/celltype.tsv"
# SNP-to-gene map: columns snp_id,gene_id,chrom,pos (build with stcnv-prep-snps)
snp_file = "../data/reference/mapped_snps.csv"
# Allele-specific CNV catalogue that events are drawn from: columns
# Chromosome,Start,End,Copy_Number,Major_Copy_Number,Minor_Copy_Number.
# NOT bundled (derived from controlled-access data) -- see data/reference/README.md.
cnv_catalog_file = "../data/reference/cnv_catalog.csv"

# Cell types from refcelltype_file to treat as normal (non-tumour).
normal_celltypes = ["T", "Fibroblast", "Macrophage", "T_reg", "Endothelial", "Hepatocyte", "Plasma", "B", "NK"]
# The normal cell type the tumour derives from; its profile seeds the tumour baseline.
normal_original_celltype = "Hepatocyte"

# Composition of the infused normal cells. Values are relative weights.
[normal_celltype_proportions]
Hepatocyte = 0.35
Fibroblast = 0.3
Macrophage = 0.16
Endothelial = 0.09
T = 0.04
B = 0.03
T_reg = 0.02
Plasma = 0.01
NK = 0.005


[population]
n_initial_cells = 2          # founder tumour clones
domain_side_size = 200       # lattice is domain_side_size x domain_side_size

fraction_drop = 0.02
background_fill_prob = 0.70
normal_action_rates = [0.80, 0.12, 0.06, 0.02]   # stay, spawn, move, death
n_clusters = 6
max_cells = 4e5
max_iterations = 150

    # Two-state model: s0 = proliferative, s1 = mutator.
    [population.transitions]
    s0s1 = 0.1
    s1s0 = 0.3

    [population.rates_state_0]
    move_rate = 0.4
    stay_rate = 0.1
    spawn_rate = 0.8
    death_rate = 0
    mutation_rate = 0

    [population.rates_state_1]
    move_rate = 0.25
    stay_rate = 0.45
    spawn_rate = 0.55
    death_rate = 0.018
    mutation_rate = 0.02

# CNV events present in the founder clones, before any evolution.
[initial_cnv]
n_shared = 6                 # events common to every founder clone
n_private = [4, 5]           # per-clone private events (int, or one entry per clone)

[expression]
lognorm_params_tumor = [8.0, 0.4]    # (mu, sigma) of the total-count lognormal
lognorm_params_normal = [6.0, 0.4]
dirichlet_precision = 100            # higher = less gene-level count noise

[spatial]
spot_radius = 2.5
n_spots_x = 30
n_spots_y = 30
st_theta = 10                # negative-binomial dispersion of spot capture
st_eff = 0.2                 # capture efficiency

# Incremental infusion of normal cells during growth ("drip"), rather than one
# pass at the end. Keeps the tumour/normal interface realistic.
[drip]
enable = true
every = 10                   # infuse every N iterations
immune_tls_share = 0.60      # fraction of TLS-eligible cells seeded into a TLS
per_cycle_max = 1200

# Tertiary lymphoid structures: dense immune aggregates placed away from tumour.
[tls]
n_tls = 2
r_tls = 6
r_block = 4
min_center_dist = 50.0
min_edge_gap = 1.0
border_margin = 0
suppress_sigma = 5
tls_celltypes = ["T", "B"]
spawn_mod = [-0.10, -0.05]   # per tumour state: lowers spawn near a TLS
death_mod = [0.05, 0.02]     # per tumour state: raises death near a TLS

# Weaker, diffuse version of the same effect around scattered immune cells.
[immune_soft]
enable = true
labels = ["T", "B", "NK", "Plasma"]
spawn_mod = [-0.05, -0.02]
death_mod = [0.02, 0.01]
sigma = 2.0

# Spatial weight maps controlling where each cell-type group is placed.
[weights]
mu_s = 4.0                   # stromal rim: distance from the tumour edge
w_s = 8.0                    # stromal rim: width
sigma_i = 3.5                # immune band: width outside the tumour
delta_epi = 2.0              # epithelial offset, further out than stroma
g_tls = 5.0                  # TLS peak gain

# Stochastic roughening of the weight maps, so replicates are not near-identical.
[perturb]
weight_temperature = 1.0
uniform_tail = 0.0002
noise_gain = 0.02
noise_sigma = 12.0
micro_blobs_per_group = 0
micro_blob_radius = 0
micro_blob_gain = 1.0
jitter_prob = 0.02
jitter_radius = 1

# Stop early once the lattice reaches the target occupancy.
[auto_iter]
enable = true
occupancy_target = 0.84

# Set a seed to make the run reproducible. Omit for a non-reproducible run
# (the simulator warns when no seed is set). 0 is a valid seed.
[reproducibility]
seed = 20260414

# Decay the state-1 mutation rate with cell age, so events accumulate early.
[mutation_schedule]
enable_state1_age_decay = true
half_life_iter = 60.0
min_factor = 0

# Maps each cell type to one of the three placement groups.
[celltype_groups]
T = "Immune"
B = "Immune"
NK = "Immune"
Macrophage = "Immune"
Plasma = "Immune"
T_reg = "Immune"
Fibroblast = "Stromal"
Endothelial = "Stromal"
Epithelial = "Epithelial"
Hepatocyte = "Epithelial"


# ==========================================
# Batch execution (read by stcnv-batch only)
# ==========================================
[batch]
replicates = 20
output_folder = "Complete_Batch_v2"
# Seed for the batch-level parameter sampler. With this set, the whole batch --
# every replicate's parameters and its own simulation seed -- is reproducible.
seed = 20260414

# Each entry is a [min, max] range sampled once per replicate. Keys are
# dot-paths into the sections above.
[batch_ranges]
# Founding clones
population.n_initial_cells = [1, 3]
population.max_cells = [300000, 550000]
population.max_iterations = [90, 150]
population.background_fill_prob = [0.60, 0.90]

# Lower mutation rate -> fewer evolved subclones
n_shared_count = [2, 8]
n_private_count = [2, 6]
population.rates_state_1.mutation_rate = [0.01, 0.02]

# Lower spawn, higher death -> lower purity, more diversity
population.rates_state_1.spawn_rate = [0.45, 0.65]
population.rates_state_1.death_rate = [0.008, 0.030]

# More aggressive normal-cell infusion -> lower purity
drip.every = [7, 15]
drip.per_cycle_max = [600, 1500]
drip.immune_tls_share = [0.5, 0.7]

# Higher occupancy target -> more normal cells in the final fill
auto_iter.occupancy_target = [0.8, 0.95]

# TLS
tls.n_tls = [2, 3]
tls.r_tls = [4, 7]

# Spatial weight maps
weights.mu_s = [3.0, 5.0]
weights.w_s = [7.0, 11.0]
weights.sigma_i = [2.8, 4.0]
weights.delta_epi = [1.2, 3.0]
weights.g_tls = [3.0, 5.0]
